<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cards">
        <h1>Focus Flow</h1>
        <p>Smart Study Planner</p>

        <div class="buttons">
            <p>Select your focus level: </p>
            <button id="deep">Deep focus</button>
            <button id="light">Light work</button>
            <button id="quick">Quick tasks</button>
            <p id="result"></p>
            <p id="timer">00:00</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
